
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneCodeLabs | From Ideas to Impact</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#2FA3FA",
                "cetacean": "#001446",
                "egyptian": "#0E3EAE",
                "aero": "#75A9EA",
                "lavender": "#CEDDFE",
                "burlywood": "#D8BF79",
                "pearl": "#EEE3C3",
                "bistre": "#846D23",
              },
              fontFamily: {
                "sans": ["Inter", "sans-serif"]
              },
            },
          },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            background-color: #001446;
        }
        .glass-nav {
            background: rgba(0, 20, 70, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .hero-gradient {
            background: radial-gradient(circle at 50% 50%, #0E3EAE 0%, #001446 80%);
        }
        .spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(600px circle at var(--x, 50%) var(--y, 50%), rgba(47, 163, 250, 0.08), transparent 40%);
            z-index: 100;
        }
        .process-line::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #2FA3FA 0%, #D8BF79 100%);
            z-index: 0;
        }
        @media (max-width: 768px) {
            .process-line::after {
                display: none;
            }
        }
    </style>
